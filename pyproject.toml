[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etimo"
dynamic = ["version"]
description = "Recursively reconstructs the formal history of an Italian word, from ancestor to ancestor, down to a terminal."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michele Stingo" }]
keywords = ["etymology", "historical-linguistics", "cli", "wiktionary", "italian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    # Upper bound because a change in how templates are parsed would alter what
    # the tool reports, silently.
    "mwparserfromhell>=0.6.5,<1.0",
]

[project.urls]
Repository = "https://github.com/6MicheleStingo9/etimo"
Issues = "https://github.com/6MicheleStingo9/etimo/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
etimo = "etimo.cli:main"

[tool.hatch.version]
path = "src/etimo/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/etimo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous characters: the output is meant to carry «» √ ⊗ ↺
    "RUF002",
    "RUF003",
]

[tool.mypy]
files = ["src/etimo"]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false

[tool.coverage.run]
branch = true
source = ["etimo"]
